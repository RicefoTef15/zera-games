// CEP: formata enquanto digita e, com 8 números, busca o endereço (ViaCEP) e preenche rua, bairro, cidade e UF.
cepType: function (e) {
var el = e.target, d = String(el.value || '').replace(/[^0-9]/g, '').slice(0, 8);
var f = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
if (el.value !== f) { el.value = f; }
if (d.length !== 8) { self._cepLast = ''; if (st.cepMsg) { self.setState({ cepMsg: '' }); } return; }
if (self._cepLast === d) { return; }
self._cepLast = d;
var fm = el.form;
self.setState({ cepMsg: 'Buscando o endereço…', cepOk: false });
fetch('https://viacep.com.br/ws/' + d + '/json/').then(function (r) { return r.json(); }).then(function (j) {
if (self._cepLast !== d) { return; }
if (!j || j.erro) { self.setState({ cepMsg: 'CEP não encontrado. Confira o número ou preencha o endereço.', cepOk: false }); return; }
var set = function (n, v) { if (fm && fm.elements[n] && v) { fm.elements[n].value = v; } };
set('rua', j.logradouro); set('bairro', j.bairro); set('cidade', j.localidade); set('uf', j.uf);
self.setState({ cepMsg: 'Endereço encontrado: ' + [j.logradouro, j.bairro, (j.localidade || '') + (j.uf ? ' - ' + j.uf : '')].filter(function (x) { return x && String(x).trim(); }).join(', ') + '. Agora é só informar o número.', cepOk: true });
if (fm && fm.elements.numero && !fm.elements.numero.value) { fm.elements.numero.focus(); }
}).catch(function () { if (self._cepLast === d) { self.setState({ cepMsg: 'Não foi possível buscar o CEP agora. Preencha o endereço normalmente.', cepOk: false }); } });
},

payNoticeCls: 'zpaynote' + (payIsPix ? '' : ' warn'),
