<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Zera Games — DualSense Edição Limitada GTA VI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Controle DualSense Edição Limitada GTA VI, preto e branco. Zera Games, Praia Grande – SP.">
<link rel="icon" href="assets/img/marca/zera-icone.png">
<script src="assets/js/zera-runtime.js" defer></script>
</head>
<body>
<template id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
.lr{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);transition:background .5s ease,color .5s ease}
.lr.night{--bg:#0B0A12;--surface:#15131F;--line:#2D2A3D;--fg:#F4F2FA;--muted:#ABA6BF;--accent:#FF6DB5;--accent2:#8CA2FF;--cta:#FF4FA3;--ctaText:#16060E}
.lr.day{--bg:#F3F0F8;--surface:#FFFFFF;--line:#D9D3E6;--fg:#14121C;--muted:#57526C;--accent:#B3136E;--accent2:#2B45C8;--cta:#B3136E;--ctaText:#FFFFFF}
.lr a{color:var(--accent)}.lr a:hover{color:var(--fg)}
.lr h1,.lr h2,.lr h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;align-items:center}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.h1{font-size:68px;line-height:1.02;letter-spacing:-0.02em}
.h2{font-size:40px;line-height:1.1;letter-spacing:-0.01em}
.opt{display:flex;align-items:center;gap:14px;flex:1 1 220px;min-height:76px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.opt.on{border-color:var(--accent)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:zspin .8s linear infinite}
@keyframes zspin{to{rotate:360deg}}
.stkline{display:flex;align-items:center;gap:8px;font:700 15px Inter,sans-serif;color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:zpulse 1.6s ease-in-out infinite}
@keyframes zpulse{0%,100%{opacity:1;scale:1}50%{opacity:.35;scale:.7}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.opt:disabled{opacity:.45;cursor:not-allowed}
.sw{width:36px;height:36px;border-radius:50%;flex:none;border:2px solid var(--line)}
.sw-b{background:#17161C}.sw-w{background:#FFFFFF}
.pip{flex:1;height:8px;border-radius:4px;background:var(--line)}
.pip.on{background:var(--accent)}
.qbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 20px Inter,sans-serif;cursor:pointer}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 32px;border-radius:14px;background:var(--cta);color:var(--ctaText) !important;font:700 18px 'Space Grotesk',Inter,sans-serif;text-decoration:none}
.cta:hover{filter:brightness(1.08)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.tile{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;box-sizing:border-box;font-size:12px;font-weight:600}
.tile-b{background:#17161C;color:#F4F2FA;border:1px solid #3A3750}
.tile-w{background:#FFFFFF;color:#14121C;border:1px solid #C9C2DA}
.tile.sold{opacity:.35;text-decoration:line-through}
.duo{position:relative;border-radius:22px;padding:0;border:2px solid var(--line);background:#EFEBF6;color:#14121C;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.duo.on{border-color:var(--accent)}
.lr details{border-top:1px solid var(--line);padding:20px 0}
.lr summary{cursor:pointer;font:500 19px 'Space Grotesk',Inter,sans-serif;min-height:28px}
.bf{background:var(--cta);color:var(--ctaText);font:700 14px 'Space Grotesk',Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:12px 16px}
.badge{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:8px;background:var(--cta);color:var(--ctaText);font:700 16px 'Space Grotesk',Inter,sans-serif}
.pricebox{border:2px solid var(--accent);border-radius:18px;padding:22px;background:var(--surface)}
.trust{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stage{perspective:1100px;touch-action:pan-y;user-select:none;cursor:grab}
.stage:active{cursor:grabbing}
.angs{display:flex;align-items:center;gap:10px;margin-top:14px}
.ang{flex:1;max-width:92px;aspect-ratio:1;padding:0;border-radius:14px;border:2px solid var(--line);background:#EFEBF6;cursor:pointer;overflow:hidden}
.ang.on{border-color:var(--accent)}
.ang img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.rig{position:absolute;inset:0;background:#EFEBF6;transform:rotateY(calc(var(--ry,0)*1deg)) rotateX(calc(var(--rx,0)*1deg)) scale(var(--sc,1));transition:transform var(--dur,.9s) cubic-bezier(.2,1.25,.3,1);will-change:transform}
.glow{position:absolute;left:12%;right:12%;top:16%;bottom:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(96,84,255,.26),rgba(255,79,163,.10) 62%,transparent);translate:calc(var(--ry,0)*-1.6px) calc(var(--rx,0)*1.6px);transition:translate var(--dur,.9s) ease-out}
.shadow{position:absolute;left:24%;right:24%;bottom:5%;height:6%;border-radius:50%;background:rgba(24,12,60,.42);filter:blur(16px);translate:calc(var(--ry,0)*-2px) 0;transition:translate var(--dur,.9s) ease-out;animation:zsh 5s ease-in-out infinite}
.ph{animation:zfloat 5s ease-in-out infinite;transform:perspective(1100px) rotateY(-90deg) scale(.9);opacity:0;transition:transform .28s ease-in,opacity .01s linear .28s}
.ph.on{transform:perspective(1100px) rotateY(0deg) scale(1);opacity:1;transition:transform .65s cubic-bezier(.2,1.3,.3,1) .28s,opacity .01s linear .28s}
.glare{position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);translate:calc(var(--ry,0)*9px) 0;opacity:var(--gl,0);transition:translate var(--dur,.9s) ease-out,opacity .4s ease}
@keyframes zfloat{0%,100%{translate:0 6px;rotate:-0.8deg}50%{translate:0 -10px;rotate:0.8deg}}
@keyframes zsh{0%,100%{scale:1;opacity:1}50%{scale:.86;opacity:.7}}
@media (prefers-reduced-motion:reduce){.ph,.shadow{animation:none}}
.rot{width:44px;height:44px;border-radius:50%;border:1px solid #C9C2DA;background:#FFFFFF;color:#14121C;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ugc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.proof{position:relative;margin:0;border-radius:20px;overflow:hidden;aspect-ratio:9/14;background:var(--surface);border:1px solid var(--line)}
.proof img{display:block;width:100%;height:100%;object-fit:cover}
.proof figcaption{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:rgba(11,10,18,.82);color:#FFFFFF;font:600 14px Inter,sans-serif}
.slot{aspect-ratio:4/5;border-radius:16px;border:2px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.prod{display:flex;flex-direction:column;gap:14px;padding:20px}
.prodimg{aspect-ratio:4/3;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;box-sizing:border-box;font-size:13px;font-weight:600;color:var(--muted)}
.tag{align-self:flex-start;padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.cta2{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--accent);color:var(--fg) !important;font:700 16px 'Space Grotesk',Inter,sans-serif;text-decoration:none}
.cta2:hover{background:var(--accent);color:var(--ctaText) !important}
.hbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 15px Inter,sans-serif;cursor:pointer}
.hbtn:hover{border-color:var(--accent)}
.hbtn.fill{background:var(--cta);border-color:var(--cta);color:var(--ctaText)}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,6,16,.72)}
.sheet{width:100%;max-width:440px;box-sizing:border-box;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.tab{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 15px Inter,sans-serif;cursor:pointer}
.tab.on{border-color:var(--accent);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input{min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:400 16px Inter,sans-serif}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--cta);color:var(--ctaText);font:700 12px Inter,sans-serif}
.scrim{position:fixed;inset:0;z-index:20;border:0;padding:0;background:rgba(8,6,16,.72);cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:100%;max-width:440px;box-sizing:border-box;background:var(--surface);color:var(--fg);border-left:1px solid var(--line);display:flex;flex-direction:column}
.citem{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.paynote{padding:12px 14px;border-radius:12px;border:1px solid var(--accent);color:var(--fg);font-size:14px;line-height:1.5}
.paynote.warn{border-color:#E8B731;background:rgba(232,183,49,.12)}
.relbox{display:flex;flex-direction:column;gap:10px;margin:20px 0 8px;padding:16px;border-radius:16px;border:2px solid var(--accent);background:var(--surface)}
.relkick{font:700 12px 'Space Grotesk',Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.relrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.relrow img{flex:none;width:64px;height:64px;border-radius:10px;object-fit:cover;background:#FFFFFF}
.reloff{display:inline-flex;align-items:center;padding:1px 7px;border-radius:6px;background:var(--cta);color:var(--ctaText);font:700 12px 'Space Grotesk',Inter,sans-serif}
.reladd{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--fg);font:700 14px 'Space Grotesk',Inter,sans-serif;cursor:pointer;white-space:nowrap}
.reladd:hover{background:var(--accent);color:var(--ctaText)}
.linkbtn{border:0;background:transparent;padding:0;min-height:44px;color:var(--muted);font:500 13px Inter,sans-serif;text-decoration:underline;cursor:pointer}
button.cta2{background:transparent;cursor:pointer}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px;margin:0}
.spec{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.spec dt{color:var(--muted);flex:none}
.spec dd{margin:0;font-weight:600;text-align:right}
@media (max-width:860px){.specs{grid-template-columns:minmax(0,1fr)}}
.co{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--bg);color:var(--fg)}
.cogrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1 / -1}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--cta);color:var(--ctaText);font:700 16px 'Space Grotesk',Inter,sans-serif;flex:none}
.sumrow{display:flex;justify-content:space-between;gap:16px;font-size:15px;line-height:1.45}
@media (max-width:860px){.cogrid,.fgrid{grid-template-columns:minmax(0,1fr)}.cosum{order:-1;position:static !important}}
.accgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:28px;align-items:start}
.ordbtn{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:18px 20px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.ordbtn.on{border-color:var(--accent)}
.tl{display:flex;gap:16px;padding-bottom:22px;position:relative}
.tldot{width:30px;height:30px;border-radius:50%;flex:none;border:3px solid var(--line);background:var(--surface);box-sizing:border-box;position:relative;z-index:1}
.tl.done .tldot{background:var(--accent);border-color:var(--accent)}
.tl.now .tldot{border-color:var(--accent);box-shadow:0 0 0 6px rgba(255,79,163,.22)}
.tl::before{content:'';position:absolute;left:14px;top:30px;bottom:0;width:3px;background:var(--line)}
.tl.done::before{background:var(--accent)}
.tl.last::before{display:none}
.tl.todo{color:var(--muted)}
@media (max-width:860px){.accgrid{grid-template-columns:minmax(0,1fr)}}
.bump{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.bump img{width:72px;height:72px;flex:none;border-radius:10px;background:#EFEBF6;object-fit:contain}
.sticky{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line)}
@media (max-width:860px){
.stagecol{order:-1}
.stage{max-height:340px}
.ugc{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding-bottom:6px}
.proof{flex:0 0 78%;scroll-snap-align:start}
.sticky .hide-sm{display:none}
.cta{width:100%;box-sizing:border-box}
.cols2,.cols3{grid-template-columns:minmax(0,1fr);gap:32px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.h1{font-size:44px}.h2{font-size:30px}
}
</style>
</helmet>
<div class="lr {{themeClass}}" style="min-height: 100vh">

<div class="bf">Black Friday · {{bfLine}}</div>
<header class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 22px; padding-bottom: 22px">
<a href="index.html" aria-label="Zera Games, voltar à página inicial" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit">
<img src="assets/img/marca/zera-icone.jpg" alt="" width="40" height="40" style="display: block; border-radius: 10px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.08em">ZERA GAMES</span>
</a>
<nav aria-label="Conta" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<a class="hbtn" href="index.html" style="text-decoration: none; color: var(--fg)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.500 8.500L9 3l6.500 5.500V15h-4.500v-4h-4v4H2.500z"></path></svg>Início</a>
<button type="button" class="hbtn" onClick="{{demoAccount}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.500L9 2l7 3.500v7L9 16l-7-3.500zM2 5.500L9 9l7-3.500M9 9v7"></path></svg>Meus pedidos</button>
<button type="button" class="hbtn" onClick="{{openCart}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 2h2.2l2 9h8.2l1.6-6H5"></path><circle cx="7" cy="14.5" r="1.2"></circle><circle cx="13" cy="14.5" r="1.2"></circle></svg>Carrinho<span class="count">{{cartCount}}</span></button>
<button type="button" class="hbtn" onClick="{{accAct1}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="3.2"></circle><path d="M2.5 16a6.5 6.5 0 0 1 13 0"></path></svg>{{accBtn1}}</button>
<button type="button" class="hbtn fill" onClick="{{accAct2}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="3.2"></circle><path d="M1 16a6 6 0 0 1 11-3M14 9v6M11 12h6"></path></svg>{{accBtn2}}</button>
</nav>
</header>
<div aria-hidden="true" style="height: 4px; background: linear-gradient(90deg, #2A6BFF, #7A3FD1)"></div>

<section id="comprar" class="wrap" style="padding-top: 56px; padding-bottom: 80px">
<div class="cols2">
<div style="display: flex; flex-direction: column; gap: 24px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent)">Edição limitada · Lote único de 14 unidades</span>
<h1 class="h1">Vice City na palma da sua mão.</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: var(--muted); max-width: 520px">Controle sem fio DualSense Edição Limitada Grand Theft Auto VI, nas duas versões. Escolha o seu lado da cidade — a página muda junto com você.</p>

<div role="group" aria-label="Escolha a cor" style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="2">
<button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" disabled="{{o.soldOut}}" onClick="{{o.pick}}">
<span class="{{o.swCls}}" aria-hidden="true"></span>
<span style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">{{o.name}}</span>
<span style="font-size: 13px; color: var(--muted)">{{o.mood}}</span>
</span>
<span class="stkline"><span class="dot" aria-hidden="true"></span>{{o.left}}</span>
</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: var(--accent)">{{stockLine}}</span>
<span style="color: var(--muted)">Estoque real, atualizado à mão</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 6px">
<sc-for list="{{pips}}" as="p" hint-placeholder-count="8">
<span class="{{p.cls}}"></span>
</sc-for>
</div>
</div>

<div class="pricebox" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{hasFrom}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 12px">
<span class="badge">{{offLabel}}</span>
<span style="font-size: 17px; color: var(--muted)">de <s>{{fromLabel}}</s> por</span>
</div>
</sc-if>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 60px; line-height: 1; letter-spacing: -0.02em">{{totalLabel}}</span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: var(--accent)">no Pix</span>
<sc-if value="{{instOn}}" hint-placeholder-val="{{true}}">
<span style="font-size: 18px; font-weight: 600">à vista no Pix · ou {{fromLabel}} em até <span style="color: var(--accent); font-weight: 700">{{instCount}}x de {{instValue}}</span> no cartão</span>
</sc-if>
<sc-if value="{{hasFrom}}" hint-placeholder-val="{{true}}">
<span style="font-size: 15px; font-weight: 600; color: var(--accent)">Você economiza {{saveLabel}}</span>
</sc-if>
<span style="font-size: 13px; color: var(--muted)">{{totalCaption}}</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" class="qbtn" aria-label="Diminuir quantidade" onClick="{{less}}">−</button>
<span aria-live="polite" style="min-width: 28px; text-align: center; font-weight: 600; font-size: 18px">{{qty}}</span>
<button type="button" class="qbtn" aria-label="Aumentar quantidade" onClick="{{more}}">+</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px">
